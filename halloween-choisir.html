<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Tu choisis. 2 programmes, le moins cher est offert | Mobility Club</title>
<meta name="description" content="Glisse deux programmes dans ta poche : tu paies le plus cher, l'autre est offert. Offre Halloween jusqu'au samedi 1er novembre minuit." />
<meta name="theme-color" content="#0D0F0E" />
<meta name="robots" content="noindex,follow" />
<link rel="canonical" href="https://mobilityclub.co/halloween/choisir" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/halloween/commun.css" />
<link rel="stylesheet" href="/assets/halloween/motion.css" />
<style>
body{padding-bottom:0;}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 420px at 50% 0%,rgba(232,116,42,.2),transparent 70%);}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 6px;font-size:14px;}
.top a{color:var(--body);text-decoration:none;font-weight:600;}
h1{font-size:clamp(40px,8vw,64px);letter-spacing:-.045em;margin:6px 0 4px;}
.lead{font-size:16px;max-width:44ch;}
.lead b{color:var(--text);}

.pocketcol{display:contents;}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0;}
.layout>*{min-width:0;}
/* poche : collante en haut sur mobile */
.pocketzone{position:sticky;top:0;z-index:30;margin:0 calc(-1*var(--gutter));padding:0 var(--gutter) 6px;background:linear-gradient(180deg,#0D0F0E 78%,rgba(13,15,14,0));}
.fan.pk{width:min(270px,76vw);height:214px;margin:10px auto 0;transition:transform .25s var(--ease),filter .25s;}
.fan.pk .pocket-back{height:104px;}
.fan.pk .pocket-front{height:90px;}
.fan.pk .pocket-front::before{top:16px;}
.fan.pk .cover{bottom:28px;width:44%;border-radius:20px;transition:transform .35s var(--ease);}
.fan.pk .cover b{font-size:16px;left:10px;top:9px;}
.fan.pk .cover b small{font-size:11px;}
.fan.pk .label{padding:5px 14px 6px;border-radius:14px;}
.fan.pk .label b{font-size:20px;}
.fan.pk .label span{font-size:11px;}
.fan.pk.over{transform:scale(1.04);filter:drop-shadow(0 0 28px rgba(232,116,42,.55));}
.fan.pk .cover.s0{left:5%;right:auto;transform:rotate(-9deg);}
.fan.pk .cover.s1{right:5%;left:auto;transform:rotate(8deg) translateY(-10px);}
.fan.pk.n1 .cover.s0{left:50%;margin-left:-22%;transform:rotate(-3deg);}
.fan.pk .cover.pop{animation:pop .45s var(--ease);}
@keyframes pop{from{opacity:0;translate:0 40px;scale:.85;}to{opacity:1;translate:0 0;scale:1;}}
.cover .x{position:absolute;z-index:3;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(13,15,14,.45);color:#fff;font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 1px rgba(255,255,255,.14);}
.cover .x:focus-visible{outline:2px solid var(--green);}
.cover .off{position:absolute;z-index:2;left:10px;top:52px;padding:2px 10px;border-radius:100px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,.15));border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(6px);}
.cover .cprice{position:absolute;z-index:2;left:10px;top:52px;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);}
.hint{position:absolute;z-index:4;left:0;right:0;bottom:14px;text-align:center;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(60,20,2,.7);pointer-events:none;}
.fan.pk .label{display:none;}
.fan.pk.vide .label{display:block;}
.fan.pk.vide .hint{display:none;}

/* étagères */
.shelves{padding:8px 0 260px;}
.shelf h2{font-size:clamp(22px,3vw,28px);margin:22px 0 4px;letter-spacing:-.03em;}
.shelf p.d{font-size:14px;color:var(--muted);margin-bottom:12px;}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px var(--gutter) 14px;margin:0 calc(-1*var(--gutter));scrollbar-width:none;}
.row::-webkit-scrollbar{display:none;}
.pack{position:relative;flex:none;width:128px;aspect-ratio:3/4.3;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.22);box-shadow:0 14px 28px -10px rgba(0,0,0,.7);background:#111412;cursor:grab;scroll-snap-align:start;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.pack img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none;}
.pack.sans-photo{background:radial-gradient(90% 70% at 50% 100%,rgba(232,116,42,.35),transparent 70%),linear-gradient(160deg,#1d201e,#111412);}
.pack::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 55%,rgba(0,0,0,.6));pointer-events:none;}
.pack b{position:absolute;z-index:1;left:11px;top:10px;right:8px;font-style:italic;font-weight:800;font-size:19px;letter-spacing:-.03em;line-height:1.05;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5);}
.pack .pr{position:absolute;z-index:1;left:11px;bottom:10px;font-weight:700;font-size:14px;color:#fff;}
.pack.in{opacity:.38;filter:saturate(.5);}
.pack.in .pr::after{content:" · dans la poche";font-weight:600;}
.pack:focus-visible{outline:2px solid var(--green);outline-offset:3px;}
.ghost{position:fixed;z-index:1000;pointer-events:none;margin:0;transform-origin:50% 50%;box-shadow:0 30px 50px -10px rgba(0,0,0,.8),0 8px 16px rgba(0,0,0,.4);will-change:transform;}
.ghost.back{transition:transform .28s var(--ease),opacity .28s;}

/* paiement : barre basse (mobile), colonne (desktop) */
.pay{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(13,15,14,.82),#0D0F0E 30%);border-top:1px solid var(--hair);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.pay-in{max-width:520px;margin:0 auto;}
.recap{list-style:none;display:grid;gap:2px;margin-bottom:8px;}
.recap li{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--body);}
.recap li b{color:var(--text);font-weight:700;}
.recap .tot{padding-top:6px;margin-top:4px;border-top:1px solid var(--hair);font-size:15px;color:var(--text);font-weight:700;}
.recap .tot span:last-child{font-size:22px;font-style:italic;font-weight:800;letter-spacing:-.03em;}
.pay .cta{width:100%;}
.pay .cta[aria-disabled=true],.pay button.cta:disabled{background:rgba(255,255,255,.07);color:var(--body);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);cursor:not-allowed;filter:none;}
.pay .cta[aria-disabled=true]::after,.pay button.cta:disabled::after{display:none;}
.pay .cta[aria-disabled=true]:hover,.pay button.cta:disabled:hover{transform:none;}
.note{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.4;}
.msg{min-height:20px;font-size:13px;color:var(--pumpkin);font-weight:600;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}


/* Paquets de bonbons : bords sertis haut et bas, papier métallisé par catégorie, reflet en diagonale. */
.pack{--z:7px;border-radius:8px;border:0;box-shadow:0 18px 30px -12px rgba(0,0,0,.8);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% 100%/var(--z) var(--z) repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) 50% 0/var(--z) var(--z) repeat-x,linear-gradient(#000 0 0) center/100% calc(100% - 2*var(--z)) no-repeat;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% 100%/var(--z) var(--z) repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) 50% 0/var(--z) var(--z) repeat-x,linear-gradient(#000 0 0) center/100% calc(100% - 2*var(--z)) no-repeat;}
.pack{--foil:linear-gradient(90deg,#9E3A0C,#F08A3E 22%,#C2551A 45%,#F7A55A 70%,#B9501A);}
.pack[data-cat="warmup"]{--foil:linear-gradient(90deg,#24182F,#6B4E8C 22%,#35264A 45%,#8A6BB0 70%,#2A1D38);}
.pack::before{content:"";position:absolute;z-index:2;left:0;right:0;top:0;height:22px;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 1px,transparent 1px 4px),var(--foil);box-shadow:0 2px 6px rgba(0,0,0,.35);}
.pack::after{background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 1px,transparent 1px 4px) bottom/100% 22px no-repeat,
  var(--foil) bottom/100% 22px no-repeat,
  linear-gradient(115deg,transparent 28%,rgba(255,255,255,.2) 36%,rgba(255,255,255,0) 44%),
  linear-gradient(180deg,rgba(0,0,0,.55),transparent 50%,rgba(0,0,0,.65));}
.pack b{top:28px;}
.pack .pr{bottom:30px;}
.pack.in .pr::after{content:" · dans ta poche";}
/* Barre de paiement : poche vide = un seul bouton, sans récap. */
.pay.vide .recap,.pay.vide .note{display:none;}
.msg:empty{min-height:0;}
@media (min-width:900px){
  .layout{grid-template-columns:380px minmax(0,1fr);gap:56px;align-items:start;}
  .pocketzone{position:sticky;top:20px;margin:0;padding:0;background:none;z-index:5;}
  .fan.pk{width:340px;height:290px;}
  .fan.pk .pocket-back{height:128px;}.fan.pk .pocket-front{height:112px;}
  .fan.pk .cover{bottom:34px;}
  .fan.pk .cover b{font-size:20px;}
  .fan.pk .label b{font-size:30px;}
  .pay{position:static;padding:18px 0 0;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;margin-top:14px;}
  .pay-in{max-width:none;}
  .shelves{padding-bottom:80px;}
  .row{flex-wrap:wrap;overflow:visible;margin:0;padding:4px 0 10px;}
  .pack{width:150px;}
  .pocketcol{display:block;position:sticky;top:20px;}
  .pocketzone{position:static;}
}
@media (prefers-reduced-motion:reduce){.fan.pk,.fan.pk .cover,.ghost.back{transition:none;}.fan.pk .cover.pop{animation:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/halloween">← Retour</a><span style="color:var(--muted);font-size:13px">Halloween · jusqu'à samedi minuit</span></div>
  <h1>Tu choisis.</h1>
  <p class="lead">Glisse <b>deux programmes</b> dans ta poche. Tu paies le plus cher, le deuxième est <b>offert</b>.</p>

  <div class="layout">
    <div class="pocketcol">
      <div class="pocketzone" id="zone">
        <div class="fan pk vide" id="poche" role="group" aria-label="Ta poche : 2 programmes maximum">
          <div class="pocket-back"></div>
          <div id="covers"></div>
          <div class="pocket-front"><svg class="jack" viewBox="0 0 300 112" preserveAspectRatio="none" aria-hidden="true" focusable="false"><defs><radialGradient id="jkFeu" cx="50%" cy="58%" r="62%"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".35" stop-color="#FFC24A"/><stop offset=".7" stop-color="#FF6A0A"/><stop offset="1" stop-color="#9E1F04"/></radialGradient><linearGradient id="jkCote" x1="0" x2="1"><stop offset="0" stop-color="#5A1E04" stop-opacity=".55"/><stop offset=".5" stop-color="#5A1E04" stop-opacity="0"/><stop offset="1" stop-color="#5A1E04" stop-opacity=".55"/></linearGradient><filter id="jkLueur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g fill="none" stroke="#7A2C06" stroke-opacity=".38" stroke-width="2.2"><path d="M60 4 C46 40 46 74 62 110"/><path d="M110 2 C102 40 102 74 112 112"/><path d="M190 2 C198 40 198 74 188 112"/><path d="M240 4 C254 40 254 74 238 110"/></g><g class="jack-feu" fill="url(#jkFeu)" stroke="#2E0E01" stroke-width="2.6" stroke-linejoin="miter" filter="url(#jkLueur)"><path d="M70 22 L128 40 L120 46 L132 50 L96 66 L80 52 Z"/><path d="M230 22 L172 40 L180 46 L168 50 L204 66 L220 52 Z"/><path d="M150 54 L140 70 L146 68 L150 74 L154 68 L160 70 Z"/><path d="M58 70 L84 78 L92 98 L104 80 L120 84 L130 106 L140 84 L160 84 L170 106 L180 84 L196 80 L208 98 L216 78 L242 70 L232 84 Q150 122 68 84 Z"/></g></svg></div>
          <div class="label"><b>1 + 1</b><span>Glisse ici</span></div>
          <div class="fan-shadow"></div>
        </div>
      </div>
      <div class="pay" id="pay">
        <div class="pay-in">
          <ul class="recap" id="recap" aria-live="polite"></ul>
          <div id="msg" class="msg" role="status"></div>
          <button class="cta" id="cta" type="button" disabled>Ajoute ton 2ᵉ programme, il est offert</button>
          <p class="note" id="note">Après le paiement, connecte-toi à l'app avec l'email de ton paiement PayPal : tes programmes t'y attendent.</p>
        </div>
      </div>
    </div>

    <div class="shelves" id="shelves"></div>
  </div>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<script src="/assets/halloween/choisir.js"></script>
</body>
</html>
