# Mobility Club — site vitrine (statique, aucun build)
# Le site reste 100% statique : `command = ""`. Netlify installe seulement les
# dépendances de la Function (@netlify/blobs) — index.html n'est jamais buildé.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Prévente de lancement : TERMINÉE (2026-08-04) ──────────────────────────
# Pendant la fenêtre de prévente, /offre-flash et /devenir-membre étaient
# redirigés en 302 vers /prevente pour n'avoir qu'une seule porte d'entrée.
# Les deux redirections sont supprimées : /devenir-membre redevient la page de
# vente, et /prevente affiche son écran « prévente terminée » qui y renvoie.
# (Elles étaient en 302 et jamais en 301 précisément pour pouvoir disparaître
# sans survivre dans le cache des navigateurs — ne jamais y remettre un 301.)
# /offre-flash s'auto-détruit sur sa propre DEADLINE et pointe déjà ici.

# En-têtes de sécurité de base (site statique, aucune donnée sensible)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
