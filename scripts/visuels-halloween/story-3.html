<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8" /><title>Story 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/halloween/commun.css" />
<link rel="stylesheet" href="visuel.css" />
<style>

.glow{background:radial-gradient(60% 24% at 50% 16%,rgba(232,116,42,.16),transparent 72%),radial-gradient(55% 20% at 50% 78%,rgba(124,107,240,.14),transparent 72%);}
.hd{position:absolute;left:80px;right:80px;top:290px;}
h1{font-size:112px;letter-spacing:-.035em;word-spacing:.07em;line-height:.98;text-wrap:balance;}
.of{margin-top:26px;font-style:italic;font-weight:800;font-size:60px;letter-spacing:-.035em;color:var(--text);}
.of em{color:var(--pumpkin);}
.packs{position:absolute;left:80px;right:80px;top:770px;display:grid;gap:26px;}
.pack{height:320px;display:grid;grid-template-columns:1fr auto;align-items:end;padding:44px 48px;}
.pack .bgp{-webkit-mask-image:linear-gradient(90deg,#000 20%,transparent 85%);mask-image:linear-gradient(90deg,#000 20%,transparent 85%);}
.pack .nm{font-size:68px;}
.pack .zs{margin-top:14px;font-size:32px;line-height:1.3;max-width:none;}
.pack .px{font-size:150px;}
.pack .px small{font-size:30px;font-weight:600;font-style:normal;letter-spacing:0;color:var(--muted);margin-left:8px;}
.pied{position:absolute;left:80px;right:80px;top:1470px;font-size:38px;color:var(--text);font-weight:700;font-style:italic;letter-spacing:-.02em;}
.pied span{color:var(--body);font-weight:500;font-style:normal;}

</style></head>
<body>
<div class="st s1080"><div class="glow"></div>
<div class="hd"><h1>Un programme <em>ou un sort.</em></h1><div class="of">1 acheté, 1 offert.</div></div>
<div class="packs">
<div class="pack lg o"><img class="bgp" src="../../assets/halloween/epaule.jpg" alt="" style="object-position:50% 78%"><div><div class="nm">Articulation</div><p class="zs">Épaule, colonne, genou…</p></div><div class="px">90 €</div></div>
<div class="pack lg v"><img class="bgp" src="../../assets/halloween/squat.jpg" alt=""><div><div class="nm">Warm Up</div><p class="zs">Squat, deadlift, course à pied…</p></div><div class="px">49 €</div></div>
</div>
<div class="pied">Tu paies le plus cher.<br><span>12 semaines, construites sur ton bilan.</span></div></div></body></html>
