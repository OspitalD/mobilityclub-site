<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8" /><title>Email 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/halloween/commun.css" />
<link rel="stylesheet" href="visuel.css" />
<style>

.glow{background:radial-gradient(50% 50% at 25% 60%,rgba(232,116,42,.12),transparent 72%),radial-gradient(50% 50% at 78% 60%,rgba(124,107,240,.12),transparent 72%);}
.hd{position:absolute;left:60px;right:60px;top:42px;font-style:italic;font-weight:800;font-size:56px;letter-spacing:-.04em;line-height:1;}
.packs{position:absolute;left:60px;right:60px;top:140px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.pack{height:340px;padding:34px 38px;display:flex;flex-direction:column;border-radius:32px;}
.pack .bgp{-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 75%);mask-image:linear-gradient(180deg,#000 0%,transparent 75%);}
.pack .nm{font-size:52px;}
.pack .zs{margin-top:10px;font-size:26px;line-height:1.3;}
.pack .px{margin-top:auto;font-size:112px;}
.pack .px small{font-size:26px;font-weight:600;font-style:normal;letter-spacing:0;color:var(--muted);margin-left:8px;}
.pied{position:absolute;left:60px;right:60px;top:512px;font-size:27px;color:var(--body);}
.pied b{color:var(--text);font-weight:700;}

</style></head>
<body>
<div class="st" style="width:1200px;height:600px"><div class="glow"></div>
<div class="hd">Deux programmes. <em>Tu paies le plus cher.</em></div>
<div class="packs">
<div class="pack lg o"><img class="bgp" src="../../assets/halloween/epaule.jpg" alt="" style="object-position:50% 78%"><div class="nm">Articulation</div><p class="zs">Une zone, 12 semaines, 3 à 5 séances par semaine.</p><div class="px">90 €</div></div>
<div class="pack lg v"><img class="bgp" src="../../assets/halloween/squat.jpg" alt=""><div class="nm">Warm Up</div><p class="zs">Un mouvement ou ton sport, 12 semaines.</p><div class="px">49 €</div></div>
</div>
<div class="pied"><b>2 Articulation ou Articulation + Warm Up : 90 €.</b> 2 Warm Up : 49 €.</div></div></body></html>
